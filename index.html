<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vortex's website</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="mainContainer">
    <div class="bg"></div>
    <div class="profileCard" id="profileMain">
      <div class="avatarContainer">
        <div class="orbitRing"></div>
        <img src="vortex.png" alt="pfp" class="profileAvatar">
      </div>
      <a class="username" href="https://www.youtube.com/@8vortex-dev">@vortex</a>
      <p class="bio">Gamer.<br/>Fullstack web developer.</p>
      
      <div class="projectSection">
        <div id="projectContent"></div>
        <button id="projectsToggle" class="projectsBtn">Projects</button>
      </div>
    </div>

    <div class="projectsContainer">
      <div class="projectsListWrapper">
        <ul class="projectsList"></ul>
      </div>
      <div class="backBtnContainer">
        <button class="backBtn">Back</button>
      </div>
    </div>
  </div>
</body>
</html>
